<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网址净化工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            margin: 20px auto;
            background: rgba(25, 25, 40, 0.8);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        header {
            background: linear-gradient(90deg, #2e7d32 0%, #388e3c 100%);
            padding: 25px;
            text-align: center;
            position: relative;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
            color: #e0f7fa;
        }
        
        .content {
            padding: 30px;
        }
        
        .input-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1rem;
            color: #4CAF50;
            font-weight: 500;
        }
        
        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #2d3748;
            background: rgba(30, 30, 50, 0.7);
            color: #76ff03;
            font-size: 1.1rem;
            resize: vertical;
            transition: all 0.3s ease;
            font-family: monospace;
        }
        
        textarea:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.3);
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .process-btn {
            flex: 3;
            background: linear-gradient(90deg, #2e7d32 0%, #388e3c 100%);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        .clear-btn {
            flex: 1;
            background: linear-gradient(90deg, #c62828 0%, #d32f2f 100%);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        .process-btn:hover {
            background: linear-gradient(90deg, #388e3c 0%, #43a047 100%);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
        
        .clear-btn:hover {
            background: linear-gradient(90deg, #d32f2f 0%, #e53935 100%);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
        
        .action-btn:active {
            transform: translateY(1px);
        }
        
        .action-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .result-box {
            margin-top: 20px;
            background: rgba(30, 30, 50, 0.6);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .result-header h2 {
            color: #4CAF50;
            font-size: 1.4rem;
        }
        
        .result-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .copy-btn {
            background: #1565c0;
            color: white;
            border: none;
        }
        
        .copy-btn:hover {
            background: #1976d2;
        }
        
        .quick-link {
            color: #76ff03;
            text-decoration: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: block;
            margin-top: 15px;
            padding: 12px;
            background: rgba(40, 40, 60, 0.7);
            border-radius: 8px;
            position: relative;
            border-left: 4px solid #4CAF50;
            transition: all 0.3s ease;
        }
        
        .quick-link:hover {
            background: rgba(50, 50, 70, 0.8);
            transform: translateX(5px);
        }
        
        .quick-link:hover::after {
            content: "尝试跳转 →";
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        
        .error-message {
            color: #ff6b6b;
            background: rgba(255, 0, 0, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            border-left: 4px solid #ff5252;
            font-size: 1rem;
        }
        
        .feature-card {
            background: rgba(30, 30, 50, 0.6);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 20px;
        }
        
        .feature-card h3 {
            color: #4CAF50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        
        .feature-card h3 i {
            margin-right: 10px;
            font-size: 1.5rem;
        }
        
        .feature-card p {
            line-height: 1.6;
            color: #b0bec5;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #b0bec5;
            margin-top: 20px;
            font-size: 0.8rem;
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .footer-link {
            color: #4CAF50;
            text-decoration: none;
            position: relative;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .footer-link:hover {
            color: #76ff03;
            text-decoration: underline;
        }
        
        .tool-link {
            position: relative;
        }
        
        .tool-link:hover::after {
            content: "真·程序员主页";
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        
        .loading {
            display: inline-block;
            margin-left: 10px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #4CAF50;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 600px) {
            .container {
                margin: 10px;
            }
            
            header {
                padding: 20px 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 20px;
            }
            
            .footer-links {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>网址净化工具</h1>
            <p class="subtitle">从含有干扰字符的文本中提取有效URL</p>
        </header>
        
        <div class="content">
            <div class="input-group">
                <label for="input">输入包含干扰字符的网址：</label>
                <textarea id="input" placeholder="示例：hXXps://www.example.com/路径_中文!?多余文字"></textarea>
            </div>
            
            <div class="action-buttons">
                <button id="processBtn" class="process-btn" onclick="cleanUrl()">
                    净化网址
                </button>
                <button class="clear-btn" onclick="clearAll()">清除</button>
            </div>
            
            <div id="error-message" class="error-message"></div>
            
            <div class="result-box">
                <div class="result-header">
                    <h2>净化结果</h2>
                    <div class="result-actions">
                        <button class="btn copy-btn" onclick="copyResult()">复制结果</button>
                    </div>
                </div>
                
                <textarea id="output" readonly></textarea>
                
                <a id="quick-link" class="quick-link" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   style="display: none;"></a>
            </div>
            
            <!-- 核心功能说明移动到结果区域下方 -->
            <div class="feature-card">
                <h3><i>🔍</i> 核心功能</h3>
                <p>智能识别并过滤非URL字符，如多余空格、特殊符号、无关文字等，从混乱文本中提取出纯净的网址。保留URL合法字符（字母、数字、-._~:/?#[]@!$&'()*+,;=%），自动识别有效协议头（http/https）。</p>
            </div>
        </div>
        
        <footer>
            <div class="footer-links">
                <span>© <span id="current-year"></span></span>
                <a href="https://chat.deepseek.com" class="footer-link tool-link" target="_blank">网址净化工具</a>
                <a href="https://space.bilibili.com/199337103" class="footer-link" target="_blank">作者链接</a>
                <a href="https://github.com/suijisjs/liangjiejinghua" class="footer-link" target="_blank">开源地址</a>
            </div>
        </footer>
    </div>

    <script>
        // 动态获取当前年份
        document.getElementById('current-year').textContent = new Date().getFullYear();
        
        // 表情符号处理函数 - 方案4
        function advancedUrlCleaning(input) {
            // 1. 中文表情识别 - 匹配1-6个中文字符的表情描述
            let cleaned = input.replace(/\[\s*[\u4e00-\u9fa5]{1,6}\s*\]/g, '');
            
            // 2. 英文表情/平台识别 - 常见表情和浏览器平台
            cleaned = cleaned.replace(/\[\s*(?:smile|laugh|cry|angry|happy|sad|cool|edge|chrome|firefox|safari|opera|ie|windows|mac|linux|android|ios|iphone|ipad|wechat|qq)\s*\]/gi, '');
            
            // 3. 基本字符净化 - 保留URL合法字符
            cleaned = cleaned.replace(/[^a-zA-Z0-9-._~:/?#\[\]@!$&'()*+,;=%]/g, '');
            
            // 4. 孤立方括号清理 - 移除不成对或不合理的方括号
            cleaned = cleaned.replace(/(?<!\w)\[(?!\w)/g, '').replace(/(?<!\w)\](?!\w)/g, '');
            
            return cleaned;
        }
        
        async function cleanUrl() {
            const inputElem = document.getElementById('input');
            const outputElem = document.getElementById('output');
            const quickLink = document.getElementById('quick-link');
            const errorMsg = document.getElementById('error-message');
            const btn = document.getElementById('processBtn');
            const input = inputElem.value.trim();

            // 重置状态
            outputElem.value = '';
            quickLink.style.display = 'none';
            errorMsg.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '处理中<span class="loading"></span>';

            try {
                await new Promise(resolve => setTimeout(resolve, 50));

                if (!input) {
                    throw new Error('请输入内容');
                }

                // 使用高级净化函数处理输入
                const cleaned = advancedUrlCleaning(input);
                
                // 新增有效性检查：净化后为空时抛出错误
                if (!cleaned) {
                    inputElem.value = '';
                    throw new Error('无法生成有效网址');
                }

                let result = cleaned;
                let isValid = false;

                try {
                    const url = new URL(result);
                    if (['http:', 'https:'].includes(url.protocol)) {
                        quickLink.href = url.href;
                        quickLink.textContent = url.href;
                        quickLink.style.display = 'block';
                        quickLink.title = url.href;
                        isValid = true;
                    }
                } catch {}

                outputElem.value = result;

                // 有效性最终检查
                if (!isValid) {
                    quickLink.style.display = 'none';
                }

            } catch (error) {
                inputElem.value = '';
                outputElem.value = '';
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '净化网址';
            }
        }

        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
            document.getElementById('quick-link').style.display = 'none';
            document.getElementById('error-message').style.display = 'none';
        }

        function copyResult() {
            const output = document.getElementById('output');
            if (!output.value) {
                showToast('没有可复制的内容');
                return;
            }

            navigator.clipboard.writeText(output.value)
                .then(() => showToast('已复制到剪贴板！'))
                .catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = output.value;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('已复制到剪贴板！');
                });
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.position = 'fixed';
            toast.style.bottom = '30px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = '#333';
            toast.style.color = '#fff';
            toast.style.padding = '12px 25px';
            toast.style.borderRadius = '8px';
            toast.style.zIndex = '1000';
            toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)';
            toast.style.fontWeight = '500';
            toast.style.transition = 'all 0.3s ease';
            toast.style.opacity = '0';
            toast.style.transform = 'translate(-50%, 20px)';
            
            document.body.appendChild(toast);
            
            // 显示动画
            setTimeout(() => {
                toast.style.opacity = '1';
                toast.style.transform = 'translate(-50%, 0)';
            }, 10);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -20px)';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 2000);
        }
    </script>
</body>
</html>
